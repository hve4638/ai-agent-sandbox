include:
  - path:
      - partials/compose.ssh.yml
    project_directory: .

services:
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workspace-sandbox
    tty: true
    stdin_open: true
    restart: unless-stopped
    ports:
      - "5030:22"
    volumes:
      - /path/to/your/directory:/playground
      - ./vol/home/.bashrc.extra:/root/.bashrc.extra:ro
      - ./vol/home/CLAUDE.md:/root/CLAUDE.md:ro
      - ./vol/home/GEMINI.md:/root/GEMINI.md:ro
      - ./vol/home/.tmux.conf:/root/.tmux.conf
      - codex-data:/root/.codex
      - copilot-data:/root/.copilot
      - gemini-data:/root/.gemini
      - claude-data:/root/.claude
    command: sh -c "service ssh start && /bin/bash"

volumes:
  claude-data:
  gemini-data:
  copilot-data:
  codex-data:
