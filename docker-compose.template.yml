# 배포 폴더(source/ 의 상위)에 docker-compose.yml 로 복사해 쓰는 파일
# init.sh 가 복사하며, 복사된 파일은 사용자 소유다
include:
  - path:
      - source/partials/compose.ssh.yml
      - source/partials/compose.vol.yml
    project_directory: .

services:
  sandbox:
    build:
      context: source
      dockerfile: Dockerfile
      args:
        NAME: ${SANDBOX_NAME:-sandbox}
        COLOR: ${SANDBOX_COLOR:-32}
    container_name: sandbox-workspace
    restart: unless-stopped
    ports:
      - "127.0.0.1:1022:22"
    volumes:
      # 작업 디렉토리: AI에게 접근을 허용할 폴더로 변경
      - ./workspace:/workspace
      # (선택) 호스트 시간대 사용
      # - /etc/localtime:/etc/localtime:ro
    # (선택) NVIDIA GPU 연결 (CDI)
    # devices:
    #   - nvidia.com/gpu=all
